<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Street Fighter II Turbo</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Loads the EmulatorJS engine -->
  <script type="text/javascript">
    EJS_player = '#game-container';
    EJS_core = 'gba';
    EJS_gameUrl = 'Super Street Fighter II Turbo - Revival (USA).gba'; // Must match your .gba filename exactly
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
